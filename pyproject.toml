[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "property-radar"
version = "0.2.0"
description = "A safe, typed Python client for the PropertyRadar API"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "The Perry Group" },
]
keywords = [
  "api-client",
  "property",
  "propertyradar",
  "real-estate",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "detect-secrets>=1.5",
  "mypy>=1.15",
  "PyYAML>=6",
  "pytest>=8.3",
  "pytest-cov>=6",
  "ruff>=0.11",
  "twine>=6",
]
docs = [
  "mkdocs-material>=9.6",
  "mkdocstrings[python]>=0.29",
]

[project.urls]
Documentation = "https://theperrygroup.github.io/property_radar/"
Issues = "https://github.com/theperrygroup/property_radar/issues"
Repository = "https://github.com/theperrygroup/property_radar"

[project.scripts]
property-radar-openapi-check = "property_radar.openapi_check:main"

[tool.hatch.build.targets.sdist]
include = [
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/src",
]

[tool.hatch.build.targets.wheel]
packages = ["src/property_radar"]

[tool.uv]
required-version = "==0.9.17"

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [
  ".codex",
  "docs/planning",
]

[tool.ruff.lint]
select = [
  "B",
  "D",
  "E",
  "F",
  "I",
  "RUF",
  "SIM",
  "UP",
]
ignore = [
  "D203",
  "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
"scripts/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
strict = true
files = [
  "src",
  "tests",
  "scripts",
]
exclude = [
  "^build/",
  "^dist/",
]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=property_radar",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=95",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["property_radar"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
show_missing = true
skip_covered = true
