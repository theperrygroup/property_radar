name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.17"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --all-extras --locked

      - name: Lint and format-check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      - name: Scan tracked files for secrets
        run: >-
          uv run detect-secrets-hook
          --exclude-files
          '^src/property_radar/endpoint_manifest\.json$|^docs/planning/'
          --exclude-secrets
          '^(synthetic-token|never-show-this-token|one|two|token)$'
          $(git ls-files)

      - name: Validate configuration syntax
        run: |
          uv run python -c "import tomllib; tomllib.load(open('pyproject.toml', 'rb'))"
          uv run python -c "from pathlib import Path; import yaml; [yaml.safe_load(path.read_text()) for path in Path('.github').rglob('*.yml')]"

  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.17"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --all-extras --locked

      - name: Run tests
        run: uv run pytest

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.17"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --all-extras --locked

      - name: Build strict documentation
        run: uv run mkdocs build --strict --clean

  build:
    name: Distribution
    needs: [quality, test, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.17"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --all-extras --locked

      - name: Build once
        run: uv build

      - name: Validate metadata
        run: uv run twine check dist/*

      - name: Verify wheel in a clean environment
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/wheel-smoke"
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -m pip install dist/*.whl
          "${RUNNER_TEMP}/wheel-smoke/bin/python" - <<'PY'
          from datetime import date
          from property_radar import (
              BUYER_TRANSFER_HISTORICAL_MATCH_CONTRACT,
              BUYER_TRANSFER_MATCH_CONTRACT,
              TRANSACTION_HISTORY_CONTRACT,
              BuyerTransferMatchCriteria,
              BuyerTransferRecordingDateRange,
              HistoricalTransactionDateRange,
              HistoricalTransactionQuery,
              PropertyRadarClient,
              TransactionParty,
              __version__,
              build_buyer_transfer_match_criteria,
              parse_buyer_transfer_match,
              parse_historical_buyer_transfer_match,
              parse_historical_transaction_quote,
              parse_historical_transaction_result,
              parse_transaction_history,
          )
          from property_radar.openapi_check import manifest_operations

          assert len(manifest_operations()) == 37
          assert TRANSACTION_HISTORY_CONTRACT["contract_fingerprint"] == (
              "d750039019a93bbfc0449b6eecdb47ea8f064e18a7dcfcbd01c3ec30c4e057a8"
          )
          assert BUYER_TRANSFER_MATCH_CONTRACT["contract_fingerprint"] == (
              "299cfaba5ddfc8337a290352433969f1f1363fa1a545080773761c2c99d2c8be"
          )
          assert __version__ == "0.4.0"
          historical = BuyerTransferMatchCriteria(
              buyer_name="Synthetic Buyer", radar_id="P-SYNTHETIC",
              state_code="UT", county_fips="49035", publication_window=None,
              recording_date_range=BuyerTransferRecordingDateRange(
                  start=date(2020, 1, 1), end=date(2025, 12, 31),
              ),
          )
          assert build_buyer_transfer_match_criteria(historical)[3] == {
              "name": "TransferRecDate",
              "value": ["from: 1/1/2020 to: 12/31/2025"],
          }
          historical_result = parse_historical_buyer_transfer_match(
              {"results": [], "totalCost": "0", "resultCount": 0,
               "totalResultCount": 0}, criteria=historical,
              purchase_requested=False,
          )
          assert historical_result.contract_fingerprint == (
              BUYER_TRANSFER_HISTORICAL_MATCH_CONTRACT["contract_fingerprint"]
          )
          transaction_query = HistoricalTransactionQuery(
              radar_id="P-SYNTHETIC",
              recording_dates=HistoricalTransactionDateRange(
                  start=date(2020, 1, 1), end=date(2025, 12, 31),
              ),
              limit=2,
          )
          quote = parse_historical_transaction_quote(
              {"resultCount": 2, "totalResultCount": 3, "totalCost": "1.00"},
              query=transaction_query,
          )
          selected = parse_historical_transaction_result(
              {"results": [{"RadarID": "P-SYNTHETIC"},
                           {"RadarID": "P-SYNTHETIC"}],
               "resultCount": 2, "totalResultCount": 3, "totalCost": "1.00"},
              query=transaction_query,
          )
          assert quote.truncated and selected.truncated
          assert len(selected.records) == 2
          assert quote.scope_fingerprint == selected.scope_fingerprint
          assert PropertyRadarClient and TransactionParty
          parsed = parse_transaction_history(
              {"results": [], "totalCost": "0", "resultCount": 0},
              purchase_requested=False,
          )
          assert parsed.billing_status == "preview"
          criteria = BuyerTransferMatchCriteria(
              buyer_name="Synthetic Buyer",
              radar_id="P-SYNTHETIC",
              state_code="UT",
              county_fips="49035",
              publication_window="Last 7 Days",
          )
          buyer_match = parse_buyer_transfer_match(
              {
                  "results": [{"RadarID": "P-SYNTHETIC"}],
                  "totalCost": "0",
                  "quantityFreeRemaining": 100,
                  "resultCount": 1,
                  "totalResultCount": 1,
              },
              criteria=criteria,
              purchase_requested=False,
          )
          assert buyer_match.matched
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14
