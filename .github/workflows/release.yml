name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure release tag is a semantic version on main
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must look like v1.2.3."
            exit 1
          fi
          git fetch origin main
          RELEASE_COMMIT="$(git rev-list -n 1 "${GITHUB_REF}")"
          git merge-base --is-ancestor "${RELEASE_COMMIT}" origin/main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.17"
          enable-cache: false

      - name: Install locked dependencies
        run: uv sync --all-extras --locked

      - name: Verify tag and package versions match
        shell: bash
        run: |
          PACKAGE_VERSION="$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          test "${GITHUB_REF_NAME}" = "v${PACKAGE_VERSION}"

      - name: Run release gates
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest
          uv run mkdocs build --strict --clean

      - name: Build once
        run: uv build

      - name: Validate distributions
        run: uv run twine check dist/*

      - name: Verify wheel in a clean environment
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/wheel-smoke"
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -m pip install dist/*.whl
          "${RUNNER_TEMP}/wheel-smoke/bin/python" - <<'PY'
          from datetime import date
          import property_radar
          from property_radar import (
              BUYER_TRANSFER_HISTORICAL_MATCH_CONTRACT,
              BUYER_TRANSFER_MATCH_CONTRACT,
              TRANSACTION_HISTORY_CONTRACT,
              BuyerTransferMatchCriteria,
              BuyerTransferRecordingDateRange,
              HistoricalTransactionDateRange,
              HistoricalTransactionQuery,
              TransactionParty,
              build_buyer_transfer_match_criteria,
              parse_buyer_transfer_match,
              parse_historical_buyer_transfer_match,
              parse_historical_transaction_quote,
              parse_historical_transaction_result,
              parse_transaction_history,
          )
          from property_radar.openapi_check import manifest_operations

          assert len(manifest_operations()) == 37
          assert TRANSACTION_HISTORY_CONTRACT["contract_fingerprint"] == (
              "d750039019a93bbfc0449b6eecdb47ea8f064e18a7dcfcbd01c3ec30c4e057a8"
          )
          assert BUYER_TRANSFER_MATCH_CONTRACT["contract_fingerprint"] == (
              "299cfaba5ddfc8337a290352433969f1f1363fa1a545080773761c2c99d2c8be"
          )
          assert TransactionParty
          parsed = parse_transaction_history(
              {"results": [], "totalCost": "0", "resultCount": 0},
              purchase_requested=False,
          )
          assert parsed.billing_status == "preview"
          criteria = BuyerTransferMatchCriteria(
              buyer_name="Synthetic Buyer",
              radar_id="P-SYNTHETIC",
              state_code="UT",
              county_fips="49035",
              publication_window="Last 7 Days",
          )
          buyer_match = parse_buyer_transfer_match(
              {
                  "results": [{"RadarID": "P-SYNTHETIC"}],
                  "totalCost": "0",
                  "quantityFreeRemaining": 100,
                  "resultCount": 1,
                  "totalResultCount": 1,
              },
              criteria=criteria,
              purchase_requested=False,
          )
          assert buyer_match.matched
          assert property_radar.__version__ == "0.4.1"
          historical = BuyerTransferMatchCriteria(
              buyer_name="Synthetic Buyer", radar_id="P-SYNTHETIC",
              state_code="UT", county_fips="49035", publication_window=None,
              recording_date_range=BuyerTransferRecordingDateRange(
                  start=date(2020, 1, 1), end=date(2025, 12, 31),
              ),
          )
          assert build_buyer_transfer_match_criteria(historical)[3] == {
              "name": "TransferRecDate",
              "value": ["from: 1/1/2020 to: 12/31/2025"],
          }
          historical_result = parse_historical_buyer_transfer_match(
              {"results": [], "totalCost": "0", "resultCount": 0,
               "totalResultCount": 0}, criteria=historical,
              purchase_requested=False,
          )
          assert historical_result.contract_fingerprint == (
              BUYER_TRANSFER_HISTORICAL_MATCH_CONTRACT["contract_fingerprint"]
          )
          transaction_query = HistoricalTransactionQuery(
              radar_id="P-SYNTHETIC",
              recording_dates=HistoricalTransactionDateRange(
                  start=date(2020, 1, 1), end=date(2025, 12, 31),
              ),
              limit=2,
          )
          quote = parse_historical_transaction_quote(
              {"resultCount": 2, "totalResultCount": 3, "totalCost": "1.00"},
              query=transaction_query,
          )
          selected = parse_historical_transaction_result(
              {"results": [{"RadarID": "P-SYNTHETIC"},
                           {"RadarID": "P-SYNTHETIC"}],
               "resultCount": 2, "totalResultCount": 3, "totalCost": "1.00"},
              query=transaction_query,
          )
          assert quote.truncated and selected.truncated
          assert len(selected.records) == 2
          assert quote.scope_fingerprint == selected.scope_fingerprint
          PY

      - name: Upload immutable release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/property-radar
    permissions:
      id-token: write
    steps:
      - name: Download exact build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/

      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download exact build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
