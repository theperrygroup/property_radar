name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure release tag is a semantic version on main
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must look like v1.2.3."
            exit 1
          fi
          git fetch origin main
          RELEASE_COMMIT="$(git rev-list -n 1 "${GITHUB_REF}")"
          git merge-base --is-ancestor "${RELEASE_COMMIT}" origin/main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.17"
          enable-cache: false

      - name: Install locked dependencies
        run: uv sync --all-extras --locked

      - name: Verify tag and package versions match
        shell: bash
        run: |
          PACKAGE_VERSION="$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          test "${GITHUB_REF_NAME}" = "v${PACKAGE_VERSION}"

      - name: Run release gates
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest
          uv run mkdocs build --strict --clean

      - name: Build once
        run: uv build

      - name: Validate distributions
        run: uv run twine check dist/*

      - name: Verify wheel in a clean environment
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/wheel-smoke"
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -m pip install dist/*.whl
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -c "import property_radar; from property_radar.openapi_check import manifest_operations; assert len(manifest_operations()) == 37; print(property_radar.__version__)"

      - name: Upload immutable release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to PyPI
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/property-radar
    permissions:
      id-token: write
    steps:
      - name: Download exact build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/

      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1

  github-release:
    name: Create GitHub release
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download exact build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"

  recover-publish:
    name: Recover v0.1.0 PyPI publication
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/property-radar
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      RECOVERY_ARTIFACT_DIGEST: sha256:fe5567258a9f2a9cf6f54d816883d0e4a4913f45548077b7dad12611cdf18a07
      RECOVERY_ARTIFACT_ID: "8681245512"
      RECOVERY_RELEASE_SHA: c48bad4336c85c0009109f1bcb8d3871de859b27
      RECOVERY_RUN_ID: "30341607839"
      RECOVERY_TAG: v0.1.0
      SDIST_SHA256: 32ccbe5932f104bf5541b051192b4d2286c62cf8fb97e9fc7c14b86b554e3f2b
      WHEEL_SHA256: 0e58884d31ed2e22b1562a3fb8cf5e0f9795ecb25b4bf9fa866d49a5b476a019
    steps:
      - name: Verify immutable recovery source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RECOVERY_TAG}" --jq .sha)" = "${RECOVERY_RELEASE_SHA}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RECOVERY_RUN_ID}" --jq .head_sha)" = "${RECOVERY_RELEASE_SHA}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RECOVERY_RUN_ID}" --jq .head_branch)" = "${RECOVERY_TAG}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RECOVERY_RUN_ID}/jobs" --jq '.jobs[] | select(.name == "Validate and build") | .conclusion')" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${RECOVERY_ARTIFACT_ID}" --jq .workflow_run.id)" = "${RECOVERY_RUN_ID}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${RECOVERY_ARTIFACT_ID}" --jq .digest)" = "${RECOVERY_ARTIFACT_DIGEST}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${RECOVERY_ARTIFACT_ID}" --jq .expired)" = "false"

      - name: Download original immutable release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: "8681245512"
          github-token: ${{ github.token }}
          run-id: "30341607839"
          path: dist/

      - name: Verify original distribution hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" = "2"
          printf '%s  %s\n' "${WHEEL_SHA256}" "dist/property_radar-0.1.0-py3-none-any.whl" | sha256sum --check
          printf '%s  %s\n' "${SDIST_SHA256}" "dist/property_radar-0.1.0.tar.gz" | sha256sum --check

      - name: Publish original distributions with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1

  recover-github-release:
    name: Recover v0.1.0 GitHub release
    if: github.event_name == 'workflow_dispatch'
    needs: recover-publish
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      RECOVERY_ARTIFACT_ID: "8681245512"
      RECOVERY_RUN_ID: "30341607839"
      RECOVERY_TAG: v0.1.0
      SDIST_SHA256: 32ccbe5932f104bf5541b051192b4d2286c62cf8fb97e9fc7c14b86b554e3f2b
      WHEEL_SHA256: 0e58884d31ed2e22b1562a3fb8cf5e0f9795ecb25b4bf9fa866d49a5b476a019
    steps:
      - name: Download original immutable release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: "8681245512"
          github-token: ${{ github.token }}
          run-id: "30341607839"
          path: dist/

      - name: Verify original distribution hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" = "2"
          printf '%s  %s\n' "${WHEEL_SHA256}" "dist/property_radar-0.1.0-py3-none-any.whl" | sha256sum --check
          printf '%s  %s\n' "${SDIST_SHA256}" "dist/property_radar-0.1.0.tar.gz" | sha256sum --check

      - name: Create release from original distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RECOVERY_TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "${RECOVERY_TAG}"
